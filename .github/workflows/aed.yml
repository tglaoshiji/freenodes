name: Auto Create Today Post & Update README

on:
  workflow_dispatch: # 允许在 GitHub 后台手动触发
  schedule:
    - cron: '0 0 * * *'

jobs:
  create-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行脚本生成文章并更新 README
        run: |
          python - << 'EOF'
          import os
          import glob
          import datetime
          import re
          import random

          posts_dir = "source/_posts"
          if not os.path.exists(posts_dir):
              print(f"Directory {posts_dir} not found.")
              exit(1)

          # 获取当天的日期对象
          today = datetime.date.today()
          today_year = today.strftime('%Y')
          today_month_no_zero = str(today.month)
          today_month_zero = today.strftime('%m')
          today_day_no_zero = str(today.day)
          today_day_zero = today.strftime('%d')
          
          # 准备多种格式，供后续根据内容动态选择
          date_formats = {
              "dash_no_zero": f"{today_year}-{today_month_no_zero}-{today_day_no_zero}",  # 例如 2026-9-22
              "dash_zero": f"{today_year}-{today_month_zero}-{today_day_zero}",          # 例如 2026-09-22
              "chinese": f"{today_year}年{today_month_no_zero}月{today_day_no_zero}日",     # 例如 2026年9月22日
              "short_chinese": f"{today_month_no_zero}月{today_day_no_zero}日",           # 例如 9月22日
              "slash": f"{today_year}/{today_month_no_zero}/{today_day_no_zero}",         # 例如 2026/9/22
              "compact": f"{today_year}{today_month_zero}{today_day_zero}"                # 例如 20260922
          }

          # ----------------- 1. 处理 _posts 目录下的最新文章 -----------------
          all_files = glob.glob(os.path.join(posts_dir, "*.md")) + glob.glob(os.path.join(posts_dir, "*.markdown"))
          
          valid_files = []
          for file in all_files:
              basename = os.path.basename(file)
              if re.match(r'^\d{4}-\d{1,2}-\d{1,2}', basename):
                  valid_files.append((basename, file))

          if valid_files:
              # 按文件名降序排序，获取最新的文件
              valid_files.sort(key=lambda x: x[0], reverse=True)
              latest_basename, latest_file = valid_files[0]
              print(f"Latest file found: {latest_file}")

              # 提取旧文件名中的日期
              date_match = re.match(r'^(\d{4})-(\d{1,2})-(\d{1,2})', latest_basename)
              old_year, old_month, old_day = date_match.groups()
              old_date_dash_1 = f"{old_year}-{old_month}-{old_day}"
              old_date_dash_2 = f"{old_year}-{int(old_month):02d}-{int(old_day):02d}"

              # 确定今天在文件名里应该用无补零还是补零（根据旧文件名风格来决定）
              if "-" in old_date_dash_1 and len(old_date_dash_1.split('-')[1]) == 1:
                  today_file_date_str = date_formats["dash_no_zero"]
              else:
                  today_file_date_str = date_formats["dash_zero"]

              if old_date_dash_1 == today_file_date_str or old_date_dash_2 == today_file_date_str:
                  print("The latest post is already dated today. Skipping creation, but will check README.")
              else:
                  # 生成新文件名并构建路径
                  new_basename = latest_basename.replace(old_date_dash_1, today_file_date_str, 1)
                  if new_basename == latest_basename:
                      new_basename = latest_basename.replace(old_date_dash_2, today_file_date_str, 1)
                  
                  new_file = os.path.join(posts_dir, new_basename)

                  if os.path.exists(new_file):
                      print(f"File {new_file} already exists.")
                  else:
                      # 读取旧文件内容
                      with open(latest_file, 'r', encoding='utf-8') as f:
                          content = f.read()

                      # 智能检测正文里用的日期短横线风格（是有补零还是没补零）
                      has_zero_padding = bool(re.search(r'\b20\d{2}-\d{2}-\d{2}\b', content))
                      target_dash_date = date_formats["dash_zero"] if has_zero_padding else date_formats["dash_no_zero"]

                      # 替换正文中的日期（先替换精确短横线日期，再替换其他格式）
                      new_content = re.sub(r'\b20\d{2}-\d{1,2}-\d{1,2}\b', target_dash_date, content)
                      new_content = re.sub(r'20\d{2}年\d{1,2}月\d{1,2}[日号]', date_formats["chinese"], new_content)
                      new_content = re.sub(r'\b\d{1,2}月\d{1,2}[日号]', date_formats["short_chinese"], new_content)
                      new_content = re.sub(r'\b20\d{2}/\d{1,2}/\d{1,2}\b', date_formats["slash"], new_content)
                      new_content = re.sub(r'\b20\d{2}\d{2}\d{2}\b', date_formats["compact"], new_content)

                      # 随机替换测速数字
                      def random_speed(match):
                          val = round(random.uniform(10.0, 35.0), 1)
                          suffix = match.group(2)
                          return f"{val}{suffix}"

                      new_content = re.sub(r'\b\d+(\.\d+)?([Mm][Bb]?/[Ss]|[Mm][Bb][Pp][Ss])\b', random_speed, new_content)

                      # 写入新文件
                      with open(new_file, 'w', encoding='utf-8') as f:
                          f.write(new_content)

                      print(f"Successfully created new post: {new_file} with auto-compatible date format")

          # ----------------- 2. 自动更新根目录下的 README.md -----------------
          readme_path = "README.md"
          if os.path.exists(readme_path):
              print(f"Found {readme_path}, updating dates...")
              with open(readme_path, 'r', encoding='utf-8') as f:
                  readme_content = f.read()

              # README 同样自动检测并兼容原本的短横线日期格式
              readme_has_zero = bool(re.search(r'\b20\d{2}-\d{2}-\d{2}\b', readme_content))
              readme_dash_date = date_formats["dash_zero"] if readme_has_zero else date_formats["dash_no_zero"]

              readme_content = re.sub(r'\b20\d{2}-\d{1,2}-\d{1,2}\b', readme_dash_date, readme_content)
              readme_content = re.sub(r'20\d{2}年\d{1,2}月\d{1,2}[日号]', date_formats["chinese"], readme_content)
              readme_content = re.sub(r'\b\d{1,2}月\d{1,2}[日号]', date_formats["short_chinese"], readme_content)
              readme_content = re.sub(r'\b20\d{2}/\d{1,2}/\d{1,2}\b', date_formats["slash"], readme_content)
              readme_content = re.sub(r'\b20\d{2}\d{2}\d{2}\b', date_formats["compact"], readme_content)

              with open(readme_path, 'w', encoding='utf-8') as f:
                  f.write(readme_content)
              print("Successfully updated dates in README.md")
          else:
              print("README.md not found in root directory, skipping.")
          EOF

      - name: 提交并推送修改
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily auto-update posts and README"
          branch: main
